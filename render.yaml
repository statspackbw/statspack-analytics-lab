services:
  - type: web
    name: statspack-analytics-lab
    runtime: python
    plan: starter          # free also works, but data only persists with DATABASE_URL set
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    envVars:
      # Set the VALUES in the Render dashboard (Environment tab) — see RENDER-ENV-SETUP.md.
      - key: DATABASE_URL   # Neon connection string — permanent storage
        sync: false
      - key: TEST_API_KEY   # pins the SmartRegister client's ingest key
        sync: false
      - key: DEMO_API_KEY   # pins the demo client's ingest key
        sync: false
